[project]
name = "maf-rag-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework>=1.11.0",
    "agent-framework-foundry>=1.10.3",
    "azure-identity>=1.25.3",
    "azure-search-documents>=12.0.0",
    "chonkie>=1.7.0",
    "huggingface-hub>=1.27.0",
    "jsonschema>=4.26.0",
    "openai>=1.99.0,<3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maf_demo"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
